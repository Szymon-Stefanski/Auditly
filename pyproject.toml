[tool.poetry]
name = "auditly"
version = "0.1.0"
description = ""
authors = ["Szymon Stefański <szymonstefanski1@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "==0.115.8"
uvicorn = "==0.29.0"
ruff = "==0.3.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = []
